name: Vergissmeinnicht
options:
  bundleIdPrefix: de.hnsstrk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  VergissmeinnichtKit:
    path: ../../swift/VergissmeinnichtKit

targets:
  Vergissmeinnicht:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    dependencies:
      - package: VergissmeinnichtKit
        product: VergissmeinnichtKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Vergissmeinnicht
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: false
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hnsstrk.vergissmeinnicht
        PRODUCT_NAME: Vergissmeinnicht
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Vergissmeinnicht.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
  # App-Test-Target (#6/#7/#8). Die committete .xcodeproj ist die maßgebliche
  # Quelle (CI baut direkt aus ihr, xcodegen wird nicht ausgeführt); dieser
  # Eintrag hält die YAML konsistent, falls jemand regeneriert.
  VergissmeinnichtTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Vergissmeinnicht
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hnsstrk.vergissmeinnichtTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vergissmeinnicht.app/Contents/MacOS/Vergissmeinnicht"
        BUNDLE_LOADER: "$(TEST_HOST)"
