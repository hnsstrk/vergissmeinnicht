name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Require a CHANGELOG.md entry for this version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if ! grep -qE "^## \[${VERSION//./\\.}\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md section '## [$VERSION]' for tag $TAG. Add a changelog entry before releasing."
            exit 1
          fi
          echo "Found CHANGELOG.md section for $VERSION."

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          rustc --version

      - name: Cache Cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build Rust core + Swift bindings + XCFramework
        run: ./scripts/build-macos.sh

      # Gate the release on the test suites — a tag must not ship untested code.
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --release

      - name: Swift package tests
        run: swift test --package-path swift/VergissmeinnichtKit

      - name: Build app (Release)
        run: |
          xcodebuild \
            -project app/Vergissmeinnicht/Vergissmeinnicht.xcodeproj \
            -scheme Vergissmeinnicht \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/ \
            build

      - name: Determine version tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compose release notes from CHANGELOG.md
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (p) exit; if (index($0, "## [" ver "]")==1) { p=1; next } }
            p { print }
          ' CHANGELOG.md | grep -v -E '^\[[^]]+\]: https?://' > notes_changelog.md || true
          cp .github/release-footer.md notes_footer.md
          sed -i '' "s/__TAG__/$TAG/g" notes_footer.md
          {
            echo "## Vergissmeinnicht $TAG"
            echo ""
            if [ -s notes_changelog.md ]; then
              cat notes_changelog.md
            else
              echo "_No CHANGELOG.md section for $VERSION — see the commit history for changes in this release._"
            fi
            cat notes_footer.md
          } > RELEASE_NOTES.md
          echo "---- RELEASE_NOTES.md ----"
          cat RELEASE_NOTES.md

      - name: Zip app bundle
        run: |
          cd build/Build/Products/Release
          /usr/bin/ditto -c -k --keepParent Vergissmeinnicht.app \
            "$GITHUB_WORKSPACE/Vergissmeinnicht-${{ steps.tag.outputs.tag }}-arm64.zip"

      - name: Generate checksum
        run: |
          shasum -a 256 "Vergissmeinnicht-${{ steps.tag.outputs.tag }}-arm64.zip" \
            > "Vergissmeinnicht-${{ steps.tag.outputs.tag }}-arm64.zip.sha256"
          cat "Vergissmeinnicht-${{ steps.tag.outputs.tag }}-arm64.zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Vergissmeinnicht ${{ steps.tag.outputs.tag }}
          files: |
            Vergissmeinnicht-*-arm64.zip
            Vergissmeinnicht-*-arm64.zip.sha256
          body_path: RELEASE_NOTES.md
