name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          rustc --version
          cargo --version

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: swift/VergissmeinnichtKit/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('swift/VergissmeinnichtKit/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build Rust core + Swift bindings + XCFramework
        run: ./scripts/build-macos.sh

      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --release

      - name: Swift package tests
        run: swift test --package-path swift/VergissmeinnichtKit

      - name: Build app (Debug)
        run: |
          xcodebuild \
            -project app/Vergissmeinnicht/Vergissmeinnicht.xcodeproj \
            -scheme Vergissmeinnicht \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
